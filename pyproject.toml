[project]
name = "gestione-docenti"
version = "0.1.0"
description = "Gestione docenti"
requires-python = ">=3.13"
dependencies = [
    "Django==5.2.18",
    "django-tasks==0.12.0",
    "django-tasks-db[compat]==0.13.0",
    "ortools==9.15.6755",
    "pdfplumber==0.11.10",
    "psycopg[binary]==3.3.6",
    "weasyprint==70.0",
    "openpyxl==3.1.5",
    "anthropic==1.14.0",
    "gunicorn==26.2.0",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-instrumentation-django==0.66b1",
    "opentelemetry-instrumentation-psycopg==0.66b1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "reportlab==5.0.1",
    "ruff==0.16.10",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
testpaths = ["tests"]
addopts = "-m 'not benchmark_full'"
markers = [
    "benchmark: 20-class solver regression guard, runs in the plain suite, skip with -m \"not benchmark\"",
    "benchmark_full: 40-class production-size solver check (about a minute), run with -m benchmark_full",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["backend", "frontend", "_docs", "**/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]
