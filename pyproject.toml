[project]
name = "gestione-docenti"
version = "0.1.0"
description = "Gestione docenti"
requires-python = ">=3.13"
dependencies = [
    "Django==5.2.18",
    "pdfplumber==0.11.10",
    "psycopg[binary]==3.3.6",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "reportlab==5.0.1",
    "ruff==0.16.10",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
testpaths = ["tests"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["backend", "frontend", "_docs", "**/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]
