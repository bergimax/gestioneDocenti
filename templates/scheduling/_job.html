<div id="job-area" class="tt-job"{% if job_oob %} hx-swap-oob="true"{% endif %}{% if running %} hx-get="{% url 'timetable_job' week.start|date:'Y-m-d' %}" hx-trigger="every 2s" hx-swap="outerHTML"{% endif %}>
  {% if running %}
  <p class="tt-running" role="status">Generazione in corso&hellip;</p>
  {% endif %}
  {% if error %}
  <div class="message message-error" role="alert"><span>{{ error }}</span></div>
  {% endif %}
  {% if show_button %}
  <form method="post" action="{% url 'timetable_generate' week.start|date:'Y-m-d' %}" hx-post="{% url 'timetable_generate' week.start|date:'Y-m-d' %}" hx-target="#job-area" hx-swap="outerHTML">
    {% csrf_token %}
    <button type="submit">Genera orario</button>
  </form>
  {% endif %}
</div>
{% if oob %}{% include "scheduling/_body.html" %}{% endif %}
{% if deroga_oob %}{% include "scheduling/_deroga.html" %}{% endif %}
