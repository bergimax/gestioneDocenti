{% extends "base.html" %}
{% block title %}Accedi{% endblock %}
{% block content %}
<h1>Accedi</h1>
<form method="post">
  {% csrf_token %}
  {% if form.non_field_errors %}<div role="alert">{{ form.non_field_errors }}</div>{% endif %}
  {% for field in form %}
    <p>{{ field.label_tag }} {{ field }}{{ field.errors }}</p>
  {% endfor %}
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit">Accedi</button>
</form>
{% endblock %}
