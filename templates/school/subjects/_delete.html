<div class="form-panel" role="group" aria-labelledby="delete-title">
  <h2 id="delete-title">Elimina {{ subject.name }}</h2>
  {% if blockers %}
  <p class="form-error">Impossibile eliminare {{ subject.name }}: {{ blockers }}. Rimuovili prima dalle rispettive schermate.</p>
  <p><a href="{% url 'subject_list' %}">Torna all'elenco</a></p>
  {% else %}
  <p>Eliminare la materia {{ subject.name }}? L'operazione non si può annullare.</p>
  <form method="post" action="{% url 'subject_delete' subject.pk %}" hx-post="{% url 'subject_delete' subject.pk %}" hx-target="#subject-section" hx-swap="outerHTML">
    {% csrf_token %}
    <button type="submit">Conferma</button>
    <a href="{% url 'subject_list' %}">Annulla</a>
  </form>
  {% endif %}
</div>
