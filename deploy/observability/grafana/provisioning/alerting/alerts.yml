apiVersion: 1
contactPoints:
  - orgId: 1
    name: oncall-agent
    receivers:
      - uid: oncall-agent-webhook
        type: webhook
        settings:
          # deploy/observability/relay.py turns it into a GitHub repository_dispatch
          url: http://oncall-relay:8080/
          httpMethod: POST
policies:
  - orgId: 1
    receiver: oncall-agent
groups:
  - orgId: 1
    name: user-impact
    folder: Gestione docenti
    interval: 1m
    rules:
      - uid: http-5xx-rate
        title: Users are getting server errors
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: More than 5% of web requests answered 5xx over 5 minutes
        labels:
          severity: page
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m])) / sum(rate(http_server_request_duration_seconds_count[5m]))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0.05]}
      - uid: pages-slow
        title: Pages are slow for users
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 95th percentile of page response time above 3 seconds over 10 minutes
        labels:
          severity: page
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket[10m])))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [3]}
      - uid: generation-errors
        title: Timetable generation is crashing
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: A timetable generation job ended in an unexpected error (not an infeasible week) in the last 10 minutes
        labels:
          severity: page
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                sum(increase(timetable_generations_total{outcome="error"}[10m]))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
